defaults:
  - .@model.encoder: megatron_model_base_config
  - .@model.decoder: megatron_model_base_config

name: megatron_whisper_ft
restore_from_path: ??? # used when starting from a .nemo file

trainer:
  devices: 2
  num_nodes: 1
  accelerator: gpu
  precision: bf16
  logger: False # logger provided by exp_manager
  enable_checkpointing: False
  use_distributed_sampler: False
  max_epochs: -1 # PTL default. In practice, max_steps will be reached first. 
  max_steps: 100000 # consumed_samples = global_step * micro_batch_size * data_parallel_size * accumulate_grad_batches
  log_every_n_steps: 10
  val_check_interval: 50
  limit_val_batches: 50
  limit_test_batches: 500
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  benchmark: False

exp_manager:
  explicit_log_dir: ${name}
  exp_dir: null
  name: ${name}
  create_wandb_logger: False
  wandb_logger_kwargs:
    project: null
    name: null
  resume_if_exists: True
  resume_ignore_no_checkpoint: True
  create_checkpoint_callback: True
  checkpoint_callback_params:
    save_top_k: 5
    mode: min
    monitor: validation_wer    # selected from "validation_wer", "validation_cer", "validation_loss"
    always_save_nemo: False # saves nemo file during validation, not implemented for model parallel
    filename: '${name}--{val_loss:.2f}-{step}-{consumed_samples}'
    model_parallel_size: ${multiply:${model.tensor_model_parallel_size}, ${model.pipeline_model_parallel_size}}

model:
  mcore_t5: True  # always set to True, this repo does not implement megatron legacy
  transformer_engine: False   # Now does not support transformer engine, always set to False
  # model parallelism 
  micro_batch_size: 16
  global_batch_size: 64 # will use more micro batches to reach global batch size
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 1  # Now does not support pipeline parallelism, always set to 1
  resume_from_checkpoint: null # manually set the checkpoint file to load from
  pipeline_model_parallel_split_rank: 0 # rank at which decoder starts.

  # model architecture
  make_vocab_size_divisible_by: 128 # Pad the vocab size to be divisible by this value for computation efficiency.

  megatron_amp_O2: True # use AMP with O2 style mixed precision instead of native amp on-the-fly weight autocasting.
  grad_allreduce_chunk_size_mb: 125
  grad_div_ar_fusion: True # Fuse grad division into torch.distributed.all_reduce
  gradient_as_bucket_view: True # Allocate gradients in a contiguous bucket to save memory (less fragmentation and buffer memory)

  encoder_seq_length: 1500
  decoder_seq_length: 448
  feature_extractor:
    path: ???  # path to huggingface model dir (feature extractor to extract mel-spectrogram
    convs: # [c_in, c_out, kernel_size, stride, padding], always set the layers of convs to 2 if you want to convert it back to original hf implementation.
    - [128, 1280, 3, 1, 1]
    - [1280, 1280, 3, 2, 1]

  tokenizer:
    library: 'huggingface'
    type: ???  # path to huggingface model dir
    model: null
    vocab_file: null
    merge_file: null

  # weight init
  embedding_init_method_std: 0.02 # Standard deviation of the zero mean normal distribution used for weight initialization.')

  # embedding dropout
  embedding_dropout: 0.1
  share_token_embeddings: True # Always set to True, which has no influence to the model, but the inhereted model need to set it to True
  share_decoder_tokens_head_embeddings: True # If True share decoder embeddings and decoder projection to logits. if you want to convert it back to original hf implementation, do no modify it.


  # whether to freeze qkv dias in attention layer, which should be true, because the original key in whisper does not have bias, but query and value does. We now give qkv bias, but freeze it (set k's bias to zero). If False, bad things might happen after you convert it back to hf
  freeze_qkv_bias: True

  # whether to freeze encoder
  freeze_encoder: True

  # precision
  native_amp_init_scale: 4294967296 # 2 ** 32
  native_amp_growth_interval: 1000
  fp16_lm_cross_entropy: False # Move the cross entropy unreduced loss calculation for lm head to fp16

  # miscellaneous
  seed: 1234
  use_cpu_initialization: False # Init weights on the CPU (slow for large models)

  data:
    train_ds:
      sample_rate: 16000
      max_dur: 30
      min_dur: 0.1
      file_names: # List of dataset jsonl files paths
        - ???
      global_batch_size: ${model.global_batch_size}
      micro_batch_size: ${model.micro_batch_size}
      shuffle: True
      num_workers: 0
      pin_memory: True
      max_seq_length: 1000
      min_seq_length: 1
      drop_last: True
      concat_sampling_probabilities: # When providing a list of datasets, this arg defines the sampling probabilities from each dataset when strategy='random'
        - ???
      audio_key: 'audio_path'
      text_key: 'text'
      task_key: 'task'
      lang_key: 'lang'
      prompt_key: 'prompt'  # Force decoder to start with (often the previous transcription of the given audio)
      timestamp_key: 'timestamp'
      truncation_field: "prompt"
      index_mapping_dir: null
      encoder_padding_method: 'max_length'   # Encoder input padding type. Original whisper use max_length to encode speech, if you want to convert it back to original hf implementation, do no modify it. Options: ['max_length', 'longest'] 
      prompt_template: "{prompt}<|startoftranscript|>{lang}{task}{timestamp}{text}" # fstring to use for decoder input
      truncation_method: 'left' # Truncation from which position, Options: ['left', 'right'] 
      global_sample_mapping: False # Whether to shuffle the replicated data all together, or shuffle the dataset within each epoch

    validation_ds:
      sample_rate: ${model.data.train_ds.sample_rate}
      max_dur: ${model.data.train_ds.max_dur}
      min_dur: ${model.data.train_ds.min_dur}
      file_names:
        - ???
      global_batch_size: ${model.global_batch_size}
      micro_batch_size: ${model.micro_batch_size}
      shuffle: False
      num_workers: 0
      pin_memory: True
      max_seq_length: ${model.data.train_ds.max_seq_length}
      min_seq_length: 1
      max_dec_length: ${model.decoder_seq_length}
      min_dec_length: 1
      use_greedy: True
      top_k: 20
      top_p: 0.9
      temperature: 1
      end_strings: ['<|endoftext|>']
      drop_last: True
      audio_key: 'audio_path'
      text_key: 'text'
      task_key: 'task'
      lang_key: 'lang'
      prompt_key: 'prompt'
      timestamp_key: 'timestamp'
      truncation_field: "prompt"
      index_mapping_dir: null
      encoder_padding_method: ${model.data.train_ds.encoder_padding_method}
      prompt_template: ${model.data.train_ds.prompt_template}
      truncation_method: 'left'
      global_sample_mapping: False
      write_predictions_to_file: True
      output_file_path_prefix: ${exp_manager.explicit_log_dir}/output
    test_ds:
      sample_rate: ${model.data.train_ds.sample_rate}
      max_dur: ${model.data.train_ds.max_dur}
      min_dur: ${model.data.train_ds.min_dur}
      file_names:
        - ???
      global_batch_size: ${model.micro_batch_size}
      micro_batch_size: ${model.micro_batch_size}
      shuffle: False
      pin_memory: True
      max_seq_length: ${model.data.train_ds.max_seq_length}
      min_seq_length: 1
      max_dec_length: ${model.decoder_seq_length}
      min_dec_length: 1
      use_greedy: True
      top_k: 20
      top_p: 0.9
      temperature: 1
      end_strings: 
        - ['<|end_of_text|>']
      drop_last: True
      audio_key: 'audio_path'
      text_key: 'text'
      task_key: 'task'
      lang_key: 'lang'
      prompt_key: 'prompt'
      timestamp_key: 'timestamp'
      truncation_field: "prompt"
      index_mapping_dir: null
      encoder_padding_method: ${model.data.train_ds.encoder_padding_method}
      prompt_template: ${model.data.train_ds.prompt_template}
      truncation_method: 'left'
      global_sample_mapping: False
      write_predictions_to_file: True
      output_file_path_prefix: ${exp_manager.explicit_log_dir}/output
  optim:
    name: fused_adam
    lr: 0.0001
    betas:
      - 0.9
      - 0.999
    eps: 1e-8
    weight_decay: 0.01
    sched:
      name: WarmupAnnealing
      min_lr: 0.00001
      last_epoch: -1
      warmup_ratio: 0.01
  encoder:
    position_embedding_type: 'sinusoidal'